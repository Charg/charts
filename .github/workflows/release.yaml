---
name: release

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  workflow_dispatch: {}

concurrency:
  # Queue rather than cancel: a signed push half-way through must run to completion, not be
  # killed mid-digest by a second push to main.
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; each job asks for exactly what it uses.
permissions: {}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only to ask GHCR whether a version already exists.
      packages: read
    outputs:
      charts: ${{ steps.plan.outputs.charts }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # Upstream Nix; see publish-chart.yaml.
          determinate: false

      - name: Decide which charts need publishing
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop -c just release-plan

  publish:
    name: publish
    needs: plan
    if: needs.plan.outputs.charts != '' && needs.plan.outputs.charts != '[]'
    strategy:
      # One chart failing must not cancel another half-way through signing.
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.charts) }}
    # The ceiling for the reusable workflow; each of its jobs narrows this to what it uses, so the
    # job holding the OIDC token cannot write to the repository and vice versa.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    # Signing lives in a reusable workflow so that the certificate identity consumers verify
    # against names that one file, not whichever workflow happened to run. The "./" form rather
    # than zizmor's suggested "$/" self-repository syntax, which the pinned actionlint rejects.
    uses: ./.github/workflows/publish-chart.yaml # zizmor: ignore[self-repository]
    with:
      chart-path: ${{ matrix.entry.path }}
