---
# Packages, pushes, signs and attests one chart, then creates its GitHub release. Called only by
# release.yaml.
#
# This file IS the signer identity: keyless certificates name the workflow whose steps ran,
# which for a reusable workflow is this file, so consumers verify against
#   https://github.com/Charg/charts/.github/workflows/publish-chart.yaml@refs/heads/main
# and no other workflow in the repository can produce a signature that passes.
name: publish-chart

on:
  workflow_call:
    inputs:
      chart-path:
        description: Repository-relative path of the chart to publish, e.g. charts/vaultwarden.
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: package, sign and attest
    runs-on: ubuntu-latest
    # Restrict this environment to the main branch in the repository settings (Settings ->
    # Environments -> release -> Deployment branches), so only main can reach the signing step.
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      chart: ${{ steps.publish.outputs.chart }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Verify image pins and signatures
        env:
          CHART_PATH: ${{ inputs.chart-path }}
        # Fail closed: a chart is never published pointing at an unpinned image, or at one of this
        # project's own images that is not signed by its release workflow.
        run: nix develop -c hack/verify-images.sh "${CHART_PATH}"

      - name: Log in to ghcr.io
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop -c hack/registry-login.sh

      - name: Package, push, sign, attest and verify
        id: publish
        env:
          CHART_PATH: ${{ inputs.chart-path }}
          # A local reusable workflow runs at the caller's ref.
          SIGNER_IDENTITY: >-
            https://github.com/${{ github.repository }}/.github/workflows/publish-chart.yaml@${{ github.ref }}
        run: nix develop -c hack/release-publish.sh "${CHART_PATH}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.ref }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  github-release:
    name: github release
    needs: publish
    runs-on: ubuntu-latest
    # The only job that writes to the repository, and it holds no OIDC token.
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.publish.outputs.chart }}-${{ needs.publish.outputs.version }}
          name: ${{ needs.publish.outputs.chart }} ${{ needs.publish.outputs.version }}
          generate_release_notes: true
