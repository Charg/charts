---
suite: test credentials secret
templates:
  - secret.yaml
tests:
  - it: renders nothing when no inline credential is set
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when only existing Secrets are configured
    set:
      auth:
        jwtSecretExistingSecret:
          name: my-jwt
      encryption:
        existingSecret:
          name: my-sig
    asserts:
      - hasDocuments:
          count: 0

  - it: holds every inline credential, and only those, under their keys
    set:
      auth:
        jwtSecret: jwt-secret-0123456789
        passwordExistingSecret:
          name: my-password
      encryption:
        key: sig-key
        salt: sig-salt
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-anythingllm
      - equal:
          path: stringData
          value:
            jwt-secret: jwt-secret-0123456789
            sig-key: sig-key
            sig-salt: sig-salt

  - it: preserves characters YAML would otherwise mangle
    set:
      auth:
        password: 'p@ss:"word"#1'
    asserts:
      - equal:
          path: stringData.auth-token
          value: 'p@ss:"word"#1'
