---
# The locked-down defaults plus everything else README.md recommends for an exposed install:
# every credential supplied, and a NetworkPolicy that admits only an ingress controller's
# namespace and allows only DNS egress. Proves Secret-backed variables reach the server, that it
# boots with no egress beyond DNS (no LLM is configured here; a real install needs extraEgress
# rules for its providers), and that the policy still admits the chart's own test pod.
auth:
  jwtSecret: ci-jwt-secret-0123456789
  password: ci-password
encryption:
  key: ci-sig-key-0123456789abcdef
  salt: ci-sig-salt-0123456789abcdef
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  restrictEgress: true
