{{- if include "anythingllm.hasInlineCredentials" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anythingllm.secretName" . }}
  labels:
    {{- include "anythingllm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range (include "anythingllm.credentials" . | fromYamlArray) }}
  {{- if .value }}
  {{ .key }}: {{ .value | toString | toJson }}
  {{- end }}
  {{- end }}
{{- end }}
