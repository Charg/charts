apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "anythingllm.fullname" . }}-test-connection"
  labels:
    {{- include "anythingllm.testLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    # The curl image's user is named (curl_user), which runAsNonRoot cannot verify; pin its uid.
    runAsUser: 100
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: ping-check
      image: "{{ .Values.test.image.repository }}:{{ .Values.test.image.tag }}"
      imagePullPolicy: {{ .Values.test.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        - |
          set -eu
          base="http://{{ include "anythingllm.fullname" . }}:{{ .Values.service.port }}"

          # /api/ping needs no auth and answers once the server is listening.
          curl -sf --max-time 10 "${base}/api/ping"
          echo

          # /api/setup-complete reads system settings from the database, so a reply proves the
          # Prisma migrations ran against the persisted SQLite file, not just that the port is open.
          response="$(curl -sf --max-time 10 "${base}/api/setup-complete")"
          echo "${response}"
          echo "${response}" | grep -q '"results"'
