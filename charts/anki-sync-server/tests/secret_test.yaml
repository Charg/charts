---
suite: test users secret
templates:
  - secret.yaml
tests:
  - it: renders nothing without users
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing with an existing Secret
    set:
      existingSecret: anki-users
    asserts:
      - hasDocuments:
          count: 0

  - it: numbers users from SYNC_USER1 in list order, as name:password
    set:
      users:
        - name: alice
          password: 'pa"ss:word'
        - name: bob
          password: bob-password
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-anki-sync-server
      - equal:
          path: stringData
          value:
            SYNC_USER1: 'alice:pa"ss:word'
            SYNC_USER2: bob:bob-password
