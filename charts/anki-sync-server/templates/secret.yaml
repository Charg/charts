{{- if .Values.users }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anki-sync-server.fullname" . }}
  labels:
    {{- include "anki-sync-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $i, $user := .Values.users }}
  {{ printf "SYNC_USER%d" (add1 $i) }}: {{ printf "%s:%s" (toString $user.name) (toString $user.password) | toJson }}
  {{- end }}
{{- end }}
