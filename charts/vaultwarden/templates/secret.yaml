{{- if include "vaultwarden.hasInlineCredentials" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vaultwarden.secretName" . }}
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range (include "vaultwarden.credentials" . | fromYamlArray) }}
  {{- if .value }}
  {{ .file }}: {{ .value | toString | toJson }}
  {{- end }}
  {{- end }}
{{- end }}
