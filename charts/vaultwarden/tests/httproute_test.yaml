---
suite: test httproute
templates:
  - httproute.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: attaches to the given Gateway and forwards to the Service
    set:
      httpRoute:
        enabled: true
        parentRefs:
          - name: public
            namespace: gateway
            sectionName: https
        hostnames:
          - vault.example.com
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: spec.parentRefs[0].name
          value: public
      - equal:
          path: spec.hostnames
          value:
            - vault.example.com
      - equal:
          path: spec.rules[0].matches
          value:
            - path:
                type: PathPrefix
                value: /
      - equal:
          path: spec.rules[0].backendRefs
          value:
            - name: RELEASE-NAME-vaultwarden
              port: 80

  - it: fails without a parentRef
    set:
      httpRoute:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: httpRoute.parentRefs must name at least one Gateway when httpRoute.enabled is true
