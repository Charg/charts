---
suite: test helm test hook
templates:
  - tests/test-connection.yaml
tests:
  - it: is a helm test hook that never carries the selector labels
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test
      - notExists:
          path: metadata.labels["app.kubernetes.io/name"]

  - it: checks /alive and /api/config through the Service
    asserts:
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: 'base="http://RELEASE-NAME-vaultwarden:80"'

  - it: follows the sub-path of domain
    set:
      domain: https://example.com/vault
    asserts:
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: 'base="http://RELEASE-NAME-vaultwarden:80/vault"'

  - it: meets the restricted Pod Security Standard and pins its image by digest
    asserts:
      - equal:
          path: spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      - matchRegex:
          path: spec.containers[0].image
          pattern: ^curlimages/curl:[^@]+@sha256:[a-f0-9]{64}$
