---
suite: test credentials secret
templates:
  - secret.yaml
tests:
  - it: renders nothing when no inline credential is set
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when only existing Secrets are configured
    set:
      admin:
        existingSecret:
          name: my-admin
      database:
        existingSecret:
          name: pg-app
    asserts:
      - hasDocuments:
          count: 0

  - it: holds every inline credential, and only those, under their file names
    set:
      admin:
        token: $argon2id$v=19$m=65540,t=3,p=4$c2FsdA$aGFzaA
      database:
        existingSecret:
          name: pg-app
      smtp:
        password: smtp-secret
      push:
        installationKey: install-key
      sso:
        clientSecret: sso-secret
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-vaultwarden
      - equal:
          path: stringData
          value:
            admin-token: $argon2id$v=19$m=65540,t=3,p=4$c2FsdA$aGFzaA
            smtp-password: smtp-secret
            push-installation-key: install-key
            sso-client-secret: sso-secret

  - it: preserves characters YAML would otherwise mangle
    set:
      database:
        url: 'postgresql://vw:p@ss:"word"#1@db/vw'
    asserts:
      - equal:
          path: stringData.database-url
          value: 'postgresql://vw:p@ss:"word"#1@db/vw'
