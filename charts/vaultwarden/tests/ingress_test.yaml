---
suite: test ingress
templates:
  - ingress.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: routes the default host to the http Service port
    set:
      ingress:
        enabled: true
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.rules[0].host
          value: vaultwarden.local
      - equal:
          path: spec.rules[0].http.paths[0]
          value:
            path: /
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-vaultwarden
                port:
                  name: http

  - it: sets className, annotations and tls
    set:
      ingress:
        enabled: true
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        tls:
          - secretName: vault-tls
            hosts:
              - vault.example.com
    asserts:
      - equal:
          path: spec.ingressClassName
          value: traefik
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt
      - equal:
          path: spec.tls[0].secretName
          value: vault-tls
