---
# The locked-down defaults plus everything else README.md recommends for an exposed install:
# admin token as an Argon2 hash, sign-ups closed, served under a sub-path, and a NetworkPolicy
# that admits only an ingress controller's namespace and allows only DNS egress. Proves the
# projected credential files (0440 + fsGroup) are readable by the non-root user, that the probes
# and helm test follow domain's sub-path, and that the policy still admits the chart's own test pod.
domain: https://vaultwarden.ci.local/vw
admin:
  # Argon2id PHC string for "ci-admin-token".
  token: "$argon2id$v=19$m=65540,t=3,p=4$WkJxNHRQZjBybDBiRnk0VQ$R79yVlHgfES/W6LhpYTFVWFDEiOZMIq7J7uWWIPsufg"
signups:
  allowed: false
invitations:
  allowed: true
env:
  DISABLE_ICON_DOWNLOAD: "true"
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  restrictEgress: true
