---
suite: test admin password secret
templates:
  - secret-admin-password.yaml
tests:
  - it: renders nothing when auth.adminPassword is unset
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when only an existing Secret is configured
    set:
      auth:
        existingSecret:
          name: my-admin-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: generates a Secret from auth.adminPassword
    set:
      auth:
        adminPassword: s3cr3t
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-technitium-dns-server-admin-password
      - equal:
          path: stringData.password
          value: s3cr3t
