---
suite: test SSO client secret secret
templates:
  - secret-sso-client-secret.yaml
tests:
  - it: renders nothing when sso.clientSecret is unset
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when only an existing Secret is configured
    set:
      sso:
        existingSecret:
          name: my-sso-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: generates a Secret from sso.clientSecret
    set:
      sso:
        clientSecret: sso-secret
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-technitium-dns-server-sso-client-secret
      - equal:
          path: stringData.client-secret
          value: sso-secret
