---
suite: test hooks
templates:
  - templates/tests/test-connection.yaml
  - templates/tests/test-recursion.yaml
tests:
  - it: keeps the status hook clear of the replicas' required anti-affinity
    templates:
      - templates/tests/test-connection.yaml
    set:
      replicaCount: 3
      podAntiAffinity: required
    asserts:
      # Carrying the selector labels would make the hook pod match the replicas' own
      # anti-affinity term, leaving it Pending on every node already running a replica.
      - isNull:
          path: metadata.labels["app.kubernetes.io/name"]
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: test

  - it: keeps the recursion hook clear of the replicas' required anti-affinity
    templates:
      - templates/tests/test-recursion.yaml
    set:
      replicaCount: 3
      podAntiAffinity: required
      test.recursion.enabled: true
    asserts:
      - isNull:
          path: metadata.labels["app.kubernetes.io/name"]
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: test

  - it: checks every replica individually, not just the load balanced Service
    templates:
      - templates/tests/test-connection.yaml
    set:
      replicaCount: 3
    asserts:
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: 'check "RELEASE-NAME-technitium-dns-server-0\.RELEASE-NAME-technitium-dns-server-headless"'
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: 'check "RELEASE-NAME-technitium-dns-server-2\.RELEASE-NAME-technitium-dns-server-headless"'

  - it: omits the recursion hook by default so an air-gapped run stays green
    templates:
      - templates/tests/test-recursion.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the recursion hook when explicitly enabled
    templates:
      - templates/tests/test-recursion.yaml
    set:
      test.recursion.enabled: true
      test.recursion.queryName: example.net
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: 'nslookup "example\.net"'

  - it: runs the status hook under the restricted Pod Security Standard, its image pinned by digest
    templates:
      - templates/tests/test-connection.yaml
    asserts:
      - equal:
          path: spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      - matchRegex:
          path: spec.containers[0].image
          pattern: ^curlimages/curl:[^@]+@sha256:[a-f0-9]{64}$

  - it: runs the recursion hook under the restricted Pod Security Standard, its image pinned by digest
    templates:
      - templates/tests/test-recursion.yaml
    set:
      test.recursion.enabled: true
    asserts:
      - equal:
          path: spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.securityContext.runAsUser
          value: 65534
      - equal:
          path: spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      - contains:
          path: spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - matchRegex:
          path: spec.containers[0].image
          pattern: ^busybox:[^@]+@sha256:[a-f0-9]{64}$
