---
# Exercises Ingress rendering and admission. kind has no ingress controller installed, so
# this proves the resource is accepted by the API server, not that traffic flows through it.
perReplicaService:
  type: ClusterIP
auth:
  adminPassword: ci-ingress-Passw0rd
ingress:
  enabled: true
  hosts:
    - host: technitium.ci.local
      paths:
        - path: /
          pathType: Prefix
