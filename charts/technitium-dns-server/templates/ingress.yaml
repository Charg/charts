{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "technitium-dns-server.fullname" . }}
  labels:
    {{- include "technitium-dns-server.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                # The web console only: the DNS ports have no place in an Ingress, since Ingress
                # routes HTTP traffic and DNS is not HTTP.
                name: {{ include "technitium-dns-server.fullname" $ }}
                port:
                  name: web
          {{- end }}
    {{- end }}
{{- end }}
