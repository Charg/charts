{{- if .Values.auth.adminPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "technitium-dns-server.adminPasswordSecretName" . }}
  labels:
    {{- include "technitium-dns-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.auth.adminPassword | quote }}
{{- end }}
