{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "technitium-dns-server.fullname" . }}
  labels:
    {{- include "technitium-dns-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "technitium-dns-server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.restrictEgress }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        {{- include "technitium-dns-server.networkPolicyPorts" . | nindent 8 }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
        # The chart's own helm test pods, so `helm test` keeps working with a restricted source list.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: test
      {{- end }}
    {{- if .Values.networkPolicy.ingressFrom }}
    # Replica to replica: native clustering syncs over the HTTPS API port, and zone transfers and
    # NOTIFY between primary and secondary zones use DNS.
    - ports:
        - port: dns-udp
          protocol: UDP
        - port: dns-tcp
          protocol: TCP
        {{- if .Values.webService.enableHttps }}
        - port: web-https
          protocol: TCP
        {{- end }}
      from:
        - podSelector:
            matchLabels:
              {{- include "technitium-dns-server.selectorLabels" . | nindent 14 }}
    {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.networkPolicy.restrictEgress }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.webService.enableHttps }}
    # Replica to replica: native clustering reaches its peers' HTTPS API port.
    - ports:
        - port: web-https
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              {{- include "technitium-dns-server.selectorLabels" . | nindent 14 }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
