---
# HIGH/CRITICAL trivy findings this chart accepts, read by hack/lint.sh (misconfigurations) and
# hack/scan-images.sh (vulnerabilities). Every entry states why it cannot be fixed in the chart.
misconfigurations:
  - id: KSV-0014
    statement: >-
      Root filesystem cannot be read-only: the image starts as root, re-owns and writes its
      install and home directories, then drops to the hermes user; the init container shares it.
