{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hermes-agent.fullname" . }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    {{- $host := .host }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          {{- $port := .port | default "api" }}
          {{- /* Validates the port name; the Ingress itself refers to the Service port by name. */}}
          {{- $_ := include "hermes-agent.servicePort" (list $ $port (printf "ingress path %s%s" $host .path)) }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "hermes-agent.fullname" $ }}
                port:
                  name: {{ $port }}
          {{- end }}
    {{- end }}
{{- end }}
