{{- if include "hermes-agent.hasInlineCredentials" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermes-agent.secretName" . }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range (include "hermes-agent.credentials" . | fromYamlArray) }}
  {{- if and .enabled .value }}
  {{ .key }}: {{ .value | toString | toJson }}
  {{- end }}
  {{- end }}
{{- end }}
