---
suite: test service account
templates:
  - serviceaccount.yaml
tests:
  - it: creates a ServiceAccount without an automounted token
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: renders nothing when create is false
    set:
      serviceAccount:
        create: false
    asserts:
      - hasDocuments:
          count: 0
