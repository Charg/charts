---
suite: test secret
templates:
  - secret.yaml
tests:
  - it: holds every enabled inline credential
    set:
      apiServer:
        key: unit-api-server-key-0123
      dashboard:
        enabled: true
        basicAuth:
          username: admin
          password: pw
          secret: signing
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData
          value:
            api-server-key: unit-api-server-key-0123
            dashboard-password: pw
            dashboard-secret: signing

  - it: leaves out credentials of a disabled feature
    set:
      apiServer:
        key: unit-api-server-key-0123
      dashboard:
        basicAuth:
          password: pw
    asserts:
      - equal:
          path: stringData
          value:
            api-server-key: unit-api-server-key-0123

  - it: is not rendered when every credential comes from an existingSecret
    set:
      apiServer:
        existingSecret:
          name: hermes-api
    asserts:
      - hasDocuments:
          count: 0
