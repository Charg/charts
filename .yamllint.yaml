---
extends: default

ignore: |
  .scratch/
  charts/*/templates/

rules:
  line-length:
    max: 120
  comments:
    min-spaces-from-content: 1
  truthy:
    # GitHub Actions' `on:` key is parsed as a boolean by yamllint's default rule.
    check-keys: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
